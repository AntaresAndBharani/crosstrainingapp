name: Merge & Backlog

# Deterministic, no model - design: ws-setups/graph-engineering/docs/merge-node.md
#
# Triggered by the review:approved label, not a GitHub-native PR review
# state (2026-08-24 — pr-review.yml moved off `gh pr review` entirely,
# since GitHub blocks that when the reviewer and PR-author identity are
# the same account, which they always are here; see pr-review.yml's own
# header for the full history). This repo's existing release.yml
# (triggered on push to main) already handles tagging and publishing the
# release, so there's nothing else for this workflow to do for a single
# subtask.
#
# Parent-story closing added 2026-08-24 — found live: story #55's three
# subtasks all merged and auto-closed via "Closes #N", but the parent
# story itself stayed open forever, since no node in this pipeline ever
# checked "is this the last subtask" and closed it. Every other part of
# the pipeline reasons about the parent story explicitly (Three Amigos'
# batch review, Dev & Test's story-level status:ready gate); this node was
# the one place that only ever looked at the single subtask/PR in front
# of it. Uses the real GitHub Sub-issues API (.../parent, .../sub_issues)
# as of 2026-08-25 — previously a Python regex script, replaced once the
# whole pipeline moved off text-based parent references. Also relabels
# the story status:ready -> status:done at close time (2026-08-25), so a
# finished story is queryable/visually distinct, not just closed state.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'review:approved'
    env:
      GH_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge the approved PR
        run: |
          set -euo pipefail
          # --auto waits for required checks (build.yml) to go green rather
          # than failing immediately if the label landed before CI finished.
          gh pr merge "$PR_NUMBER" -R "$REPO" --auto --squash --delete-branch

      - name: Close the parent story once every subtask is done
        run: |
          set -euo pipefail

          # "Closes #N" / "Fixes #N" / "Resolves #N" - same convention used
          # everywhere else in this pipeline to link a PR to its subtask.
          PR_BODY=$(gh pr view "$PR_NUMBER" -R "$REPO" --json body -q '.body')
          SUBTASK=$(echo "$PR_BODY" | grep -oiP '(close[sd]?|fixe?[sd]?|resolve[sd]?)\s*:?\s*#\K[0-9]+' | head -1 || true)
          if [ -z "${SUBTASK:-}" ]; then
            echo "No linked subtask found in PR body — nothing to check."
            exit 0
          fi

          STORY=$(gh api "repos/$REPO/issues/$SUBTASK/parent" -q .number 2>/dev/null || true)
          if [ -z "${STORY:-}" ]; then
            echo "Subtask #$SUBTASK has no parent story reference — nothing to check."
            exit 0
          fi

          OPEN_SIBLINGS=$(gh api "repos/$REPO/issues/$STORY/sub_issues" \
            -q '[.[] | select(.state=="open")] | length')

          if [ "$OPEN_SIBLINGS" -gt 0 ]; then
            echo "Story #$STORY still has $OPEN_SIBLINGS open subtask(s) — not closing yet."
            exit 0
          fi

          gh issue comment "$STORY" -R "$REPO" --body "**All subtasks complete.** Every sub-issue linked to this story is now closed — the last one was #${SUBTASK}, merged via #${PR_NUMBER}. Closing this story."
          # Leave the story queryably distinct from one still in flight,
          # not just relying on issue state (open/closed) to carry that.
          gh issue edit "$STORY" -R "$REPO" --remove-label "status:ready" 2>/dev/null || true
          gh issue edit "$STORY" -R "$REPO" --add-label "status:done"
          gh issue close "$STORY" -R "$REPO"

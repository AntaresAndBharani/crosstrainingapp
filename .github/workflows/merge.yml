name: Merge & Backlog

# Deterministic, no model - design: ws-setups/graph-engineering/docs/merge-node.md
#
# Triggered by the review:approved label, not a GitHub-native PR review
# state (2026-08-24 — pr-review.yml moved off `gh pr review` entirely,
# since GitHub blocks that when the reviewer and PR-author identity are
# the same account, which they always are here; see pr-review.yml's own
# header for the full history). This repo's existing release.yml
# (triggered on push to main) already handles tagging and publishing the
# release, so there's nothing else for this workflow to do.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'review:approved'
    env:
      GH_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge the approved PR
        run: |
          set -euo pipefail
          # --auto waits for required checks (build.yml) to go green rather
          # than failing immediately if the label landed before CI finished.
          gh pr merge "$PR_NUMBER" -R "$REPO" --auto --squash --delete-branch

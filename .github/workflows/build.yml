name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build snapshot APK
        run: ./gradlew assembleSnapshot -PsnapshotLabel=${{ env.SHORT_SHA }} --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/snapshot/app-snapshot.apk dist/crosstraining-snapshot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosstraining-snapshot-${{ env.SHORT_SHA }}
          path: dist/crosstraining-snapshot.apk
          if-no-files-found: error

      # Rolling pre-release so the latest snapshot can be downloaded straight
      # from a phone (Releases -> "Snapshot"). Skipped on pull_request events
      # because the branch push event already publishes the same commit.
      - name: Delete previous snapshot release and tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true

      - name: Update rolling snapshot pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Snapshot (latest dev build)
          prerelease: true
          files: dist/crosstraining-snapshot.apk
          body: |
            Latest development snapshot — branch `${{ github.ref_name }}`, commit `${{ env.SHORT_SHA }}`.

            Installs **alongside** the released app as **CrossTraining Snapshot**
            (`com.fractanomics.crosstraining.snapshot`), so you can test a branch
            before merging and releasing without touching your real data.

            **Install on your phone**
            1. Download `crosstraining-snapshot.apk` below.
            2. Open it; allow "Install unknown apps" if prompted.
            3. Tap Install.

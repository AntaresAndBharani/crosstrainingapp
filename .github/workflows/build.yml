name: PR Snapshot Build & Pre-Release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Concurrency configuration:
# - A new push to the same PR branch supersedes the in-flight snapshot build (cancel-in-progress: true).
# - Cancellation is safe because the rolling snapshot release is updated in place and never deleted.
# - The rolling release is shared across open PRs (last-writer-wins); each workflow_dispatch run gets
#   a unique group via github.run_id so manual builds never cancel each other.
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  script-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script test suite
        shell: pwsh
        run: ./scripts/tests/Invoke-ScriptTests.ps1

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute build metadata
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${HEAD_SHA:0:7}"
            RAW_BRANCH="$HEAD_REF"
            PR_LABEL="PR #${{ github.event.pull_request.number }}"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            RAW_BRANCH="${GITHUB_REF_NAME}"
            PR_LABEL="Manual Build"
          fi
          # Security: Sanitize BRANCH_NAME to an allowlist of characters [a-zA-Z0-9._/-].
          # While action `with:` parameter interpolation is not shell-executed and therefore immune
          # to command injection, branch names originating from untrusted PRs can contain Markdown
          # metacharacters (e.g. backticks, brackets, parentheses). If unescaped, a crafted branch
          # name could break out of the inline code span in the release body and inject arbitrary
          # Markdown/HTML links (content spoofing/phishing). Replacing non-allowlisted characters
          # with '_' guarantees the value remains a benign string in rendered Markdown.
          SAFE_BRANCH=$(printf '%s' "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9._/-]/_/g')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> "$GITHUB_ENV"
          echo "PR_LABEL=$PR_LABEL" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "UNIT_TEST_ARTIFACT=unit-test-report-pr-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publish unit test summary
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/summarize-unit-tests.ps1 `
            -ResultsDir app/build/test-results/testDebugUnitTest `
            -PrNumber "${{ github.event.pull_request.number }}" `
            -Repo "${{ github.repository }}" `
            -ArtifactName "${{ env.UNIT_TEST_ARTIFACT }}"

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UNIT_TEST_ARTIFACT }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Build snapshot APK
        run: ./gradlew assembleSnapshot -PsnapshotLabel=${{ env.SHORT_SHA }} --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/snapshot/app-snapshot.apk dist/crosstraining-snapshot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosstraining-snapshot-${{ env.SHORT_SHA }}
          path: dist/crosstraining-snapshot.apk
          overwrite: true
          if-no-files-found: error

      # Rolling pre-release so the snapshot can be downloaded directly
      # to a phone from the Releases page (Releases -> "Snapshot").
      # Updated in-place via softprops/action-gh-release (no delete-and-recreate step)
      # to prevent leaving the Releases page without a snapshot if a run is cancelled.
      # Note: The 'snapshot' git tag remains pinned to its initial commit; the release body
      # carries the authoritative record of the PR, branch, and commit for each build.
      # Requires workflow-level 'contents: write' permission (declared at top of file).
      # Note: GitHub Actions issues a read-only GITHUB_TOKEN for pull_request events triggered
      # from forked repositories, so snapshot release publishing is expected to fail on fork PRs.
      #
      # Security boundary & injection safety:
      # - Command injection: The `body` input below is passed directly as a `with:` parameter to
      #   `softprops/action-gh-release` (a JS Action), not executed inside a shell. GitHub Actions
      #   evaluates ${{ env.* }} expressions before invoking the action, so shell/command injection
      #   is impossible.
      # - Markdown / content injection: To prevent untrusted branch names from breaking out of the
      #   surrounding backtick code span and injecting phishing links or deceptive markdown,
      #   `BRANCH_NAME` is strictly sanitized to [a-zA-Z0-9._/-] in the 'Compute build metadata' step.
      #   `PR_LABEL` and `SHORT_SHA` are internally controlled and safe.
      - name: Publish rolling snapshot pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: snapshot
          name: Snapshot (latest dev build)
          prerelease: true
          files: dist/crosstraining-snapshot.apk
          body: |
            Latest development snapshot — ${{ env.PR_LABEL }} (`${{ env.BRANCH_NAME }}`), commit `${{ env.SHORT_SHA }}`.

            Installs **alongside** the released app as **CrossTraining Snapshot**
            (`com.fractanomics.crosstraining.snapshot`), so you can test before merging without touching real data.

            **Install on your phone:**
            1. Download `crosstraining-snapshot.apk` below.
            2. Open it; allow "Install unknown apps" if prompted.
            3. Tap Install.

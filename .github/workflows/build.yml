name: PR CI & Test Verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Concurrency configuration:
# - A new push to the same PR branch supersedes in-flight test runs (cancel-in-progress: true).
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  script-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script test suite
        shell: pwsh
        run: ./scripts/tests/Invoke-ScriptTests.ps1

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute build metadata
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${HEAD_SHA:0:7}"
            RAW_BRANCH="$HEAD_REF"
            PR_LABEL="PR #${{ github.event.pull_request.number }}"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            RAW_BRANCH="${GITHUB_REF_NAME}"
            PR_LABEL="Manual Build"
          fi
          SAFE_BRANCH=$(printf '%s' "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9._/-]/_/g')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> "$GITHUB_ENV"
          echo "PR_LABEL=$PR_LABEL" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "UNIT_TEST_ARTIFACT=unit-test-report-pr-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publish unit test summary
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/summarize-unit-tests.ps1 `
            -ResultsDir app/build/test-results/testDebugUnitTest `
            -PrNumber "${{ github.event.pull_request.number }}" `
            -Repo "${{ github.repository }}" `
            -ArtifactName "${{ env.UNIT_TEST_ARTIFACT }}"

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UNIT_TEST_ARTIFACT }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

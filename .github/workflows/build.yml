name: PR Snapshot Build & Pre-Release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Concurrency configuration:
# - A new push to the same PR branch supersedes the in-flight snapshot build (cancel-in-progress: true).
# - Cancellation is safe because the rolling snapshot release is updated in place and never deleted.
# - The rolling release is shared across open PRs (last-writer-wins); each workflow_dispatch run gets
#   a unique group via github.run_id so manual builds never cancel each other.
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script test suite
        shell: pwsh
        run: ./scripts/test-summarize-unit-tests.ps1

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute build metadata
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "SHORT_SHA=${HEAD_SHA:0:7}" >> "$GITHUB_ENV"
            echo "BRANCH_NAME=${{ github.head_ref }}" >> "$GITHUB_ENV"
            echo "PR_LABEL=PR #${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
            echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "PR_LABEL=Manual Build" >> "$GITHUB_ENV"
          fi

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publish unit test summary
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/summarize-unit-tests.ps1 `
            -ResultsDir app/build/test-results/testDebugUnitTest `
            -PrNumber "${{ github.event.pull_request.number }}" `
            -Repo "${{ github.repository }}" `
            -ArtifactName "unit-test-report-pr-${{ env.SHORT_SHA }}"

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-pr-${{ env.SHORT_SHA }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Build snapshot APK
        run: ./gradlew assembleSnapshot -PsnapshotLabel=${{ env.SHORT_SHA }} --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/snapshot/app-snapshot.apk dist/crosstraining-snapshot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosstraining-snapshot-${{ env.SHORT_SHA }}
          path: dist/crosstraining-snapshot.apk
          overwrite: true
          if-no-files-found: error

      # Rolling pre-release so the snapshot can be downloaded directly
      # to a phone from the Releases page (Releases -> "Snapshot").
      # Updated in-place via softprops/action-gh-release (no delete-and-recreate step)
      # to prevent leaving the Releases page without a snapshot if a run is cancelled.
      # Note: The 'snapshot' git tag remains pinned to its initial commit; the release body
      # carries the authoritative record of the PR, branch, and commit for each build.
      - name: Publish rolling snapshot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Snapshot (latest dev build)
          prerelease: true
          files: dist/crosstraining-snapshot.apk
          body: |
            Latest development snapshot — ${{ env.PR_LABEL }} (`${{ env.BRANCH_NAME }}`), commit `${{ env.SHORT_SHA }}`.

            Installs **alongside** the released app as **CrossTraining Snapshot**
            (`com.fractanomics.crosstraining.snapshot`), so you can test before merging without touching real data.

            **Install on your phone:**
            1. Download `crosstraining-snapshot.apk` below.
            2. Open it; allow "Install unknown apps" if prompted.
            3. Tap Install.

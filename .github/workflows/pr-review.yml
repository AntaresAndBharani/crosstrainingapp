name: PR Review

# Authoritative review pass for the agentic SDLC pipeline. Design:
# ws-setups/graph-engineering/docs/pr-review-node.md
#
# Comment + label, not a formal GitHub review (2026-08-24 — third design
# for this node in one day). `gh pr review --approve`/`--request-changes`
# is blocked by GitHub itself whenever the reviewing identity is the same
# one that opened the PR ("Can not request changes on your own pull
# request") — and ORCHESTRATION_PAT always is that identity, since
# dev-test.yml uses it to open every PR too. Not a permissions problem —
# admin rights on the same account don't bypass it. A follow-up attempt to
# reuse claude-code-action's own installation token (a genuinely different
# identity) also failed: the action revokes that token as part of its own
# step's cleanup before a later step can reuse it (confirmed via HTTP 401).
# Rather than add Bash to Claude's allowedTools (broadens what it can
# execute against untrusted PR content) or stand up a whole separate bot
# identity, this drops formal GitHub review state entirely: a plain
# `gh pr comment` (no identity restriction at all) carries the verdict,
# and a label (`review:approved` / `review:changes-requested`) is what
# merge.yml and dev-test.yml's fix-up trigger actually key off — same
# pattern every other node in this pipeline already uses.
#
# Security note: PR title/body/diff content is untrusted input (this is a
# public repo, and even same-repo branches carry whatever the implementer
# — human or Gemini — wrote). Never interpolate it directly into
# `run:`/`with:` GitHub Actions expressions; it's written to files by `gh`
# (safe) and read by Claude via its own file tools.
#
# Retry-on-overload (2026-08-24): the "Run PR Review" step attempts up to
# 3 times with a 5-minute wait between, before giving up. Real PR #62
# failure: Anthropic's API returned 529 Overloaded, and claude-code-action's
# own internal retry (10 attempts, exponential backoff, ~3 min total) wasn't
# enough — a second manual rerun ~5 min later hit the exact same wall. This
# adds a longer-timescale retry on top of that short one, not instead of
# it. If all 3 attempts still fail, the PR gets a comment explaining why
# rather than silently sitting unreviewed.
#
# Model: Claude Sonnet 5, not Opus (2026-08-25 — PO's explicit cost call,
# flat across every review, no conditional). Architect kept Opus as its
# default the same day but gained a conditional Sonnet path for
# backlog-triage-originated stories specifically — the two nodes' cost
# decisions aren't symmetric, don't assume this one generalizes there.

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

env:
  ROUND_CAP: 3
  OVERLOAD_RETRY_DELAY_SECONDS: 300
  VERDICT_MARKER: "<!-- pr-review-verdict -->"

jobs:
  pr-review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Count prior CHANGES_REQUESTED rounds
        id: rounds
        run: |
          set -euo pipefail
          COUNT=$(gh pr view "$PR_NUMBER" -R "$REPO" --json comments \
            -q "[.comments[].body | select(startswith(\"$VERDICT_MARKER\")) | select(contains(\"CHANGES_REQUESTED\"))] | length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Escalate directly if round cap reached
        if: steps.rounds.outputs.count >= env.ROUND_CAP
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" -R "$REPO" --body "**PR Review escalation — round cap reached (3):** this PR has gone through 3 review/fix rounds without reaching APPROVED. Not reviewing again automatically — please look at the history above and decide how to proceed."

      - name: Checkout
        if: steps.rounds.outputs.count < env.ROUND_CAP
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch PR context + linked issue (safe — via gh/jq, not shell-interpolated)
        if: steps.rounds.outputs.count < env.ROUND_CAP
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" -R "$REPO" --json number,title,body,url > pr_meta.json
          gh pr diff "$PR_NUMBER" -R "$REPO" > pr_diff.txt

          jq -n --slurpfile meta pr_meta.json --rawfile diff pr_diff.txt \
            '{number: $meta[0].number, title: $meta[0].title, body: $meta[0].body, url: $meta[0].url, diff: $diff}' \
            > pr_context.json

          # "Closes #N" / "Fixes #N" / "Resolves #N" is the standard GitHub
          # convention for linking a PR to the issue it addresses.
          LINKED=$(jq -r '.body' pr_meta.json | grep -oiP '(close[sd]?|fixe?[sd]?|resolve[sd]?)\s*:?\s*#\K[0-9]+' | head -1 || true)
          if [ -n "${LINKED:-}" ]; then
            gh issue view "$LINKED" -R "$REPO" --json number,title,body > linked_issue.json || true
          fi

      - name: Run PR Review (Claude Sonnet) — attempt 1
        id: review_attempt_1
        if: steps.rounds.outputs.count < env.ROUND_CAP
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-5 --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'
          prompt: |
            Follow the instructions in the file
            .github/workflows/prompts/pr-review.md exactly. Read
            pr_context.json and, if present, linked_issue.json before doing
            anything else.

      - name: Wait before retry 2 (Anthropic overload backoff)
        if: steps.rounds.outputs.count < env.ROUND_CAP && steps.review_attempt_1.outcome == 'failure'
        run: sleep "$OVERLOAD_RETRY_DELAY_SECONDS"

      - name: Run PR Review (Claude Sonnet) — attempt 2
        id: review_attempt_2
        if: steps.rounds.outputs.count < env.ROUND_CAP && steps.review_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-5 --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'
          prompt: |
            Follow the instructions in the file
            .github/workflows/prompts/pr-review.md exactly. Read
            pr_context.json and, if present, linked_issue.json before doing
            anything else.

      - name: Wait before retry 3 (Anthropic overload backoff)
        if: >
          steps.rounds.outputs.count < env.ROUND_CAP &&
          steps.review_attempt_1.outcome == 'failure' &&
          steps.review_attempt_2.outcome == 'failure'
        run: sleep "$OVERLOAD_RETRY_DELAY_SECONDS"

      - name: Run PR Review (Claude Sonnet) — attempt 3
        id: review_attempt_3
        if: >
          steps.rounds.outputs.count < env.ROUND_CAP &&
          steps.review_attempt_1.outcome == 'failure' &&
          steps.review_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-5 --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'
          prompt: |
            Follow the instructions in the file
            .github/workflows/prompts/pr-review.md exactly. Read
            pr_context.json and, if present, linked_issue.json before doing
            anything else.

      - name: Apply review verdict + file follow-up issues
        if: steps.rounds.outputs.count < env.ROUND_CAP
        run: |
          set -euo pipefail

          if [ ! -f review_output.json ]; then
            gh pr comment "$PR_NUMBER" -R "$REPO" --body "**PR Review couldn't complete after 3 attempts (~10 minutes apart):** Anthropic's API returned a server-side overload error each time — not a bug in this pipeline. Check https://status.claude.com; once it clears, either push a new commit to retrigger this automatically, or re-run this workflow manually."
            echo "::error::review_output.json was not produced after 3 attempts — likely sustained Anthropic API overload, see PR comment."
            exit 1
          fi

          VERDICT=$(jq -r '.verdict' review_output.json)
          COMMENT_FILE=$(mktemp)
          {
            echo "$VERDICT_MARKER"
            echo "**Verdict: $VERDICT**"
            echo
            jq -r '.pr_comment_markdown' review_output.json
          } > "$COMMENT_FILE"

          case "$VERDICT" in
            APPROVED|CHANGES_REQUESTED)
              # A subtask's own subsequent Dev & Test push, or a re-review
              # after one, can leave the other verdict label stuck from a
              # prior round — remove both possibilities before adding the
              # new one, not just the one we expect (same bug class as the
              # status:awaiting-approval promotion fix earlier today).
              gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label "review:approved" 2>/dev/null || true
              gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label "review:changes-requested" 2>/dev/null || true
              gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$COMMENT_FILE"
              if [ "$VERDICT" = "APPROVED" ]; then
                gh pr edit "$PR_NUMBER" -R "$REPO" --add-label "review:approved"
              else
                gh pr edit "$PR_NUMBER" -R "$REPO" --add-label "review:changes-requested"
              fi
              ;;
            *)
              echo "::error::Unexpected verdict '$VERDICT' — leaving the PR unreviewed for manual triage."
              rm -f "$COMMENT_FILE"
              exit 1
              ;;
          esac
          rm -f "$COMMENT_FILE"

          FOLLOWUP_COUNT=$(jq '.followup_backlog_issues | length' review_output.json)
          for i in $(seq 0 $((FOLLOWUP_COUNT - 1))); do
            TITLE=$(jq -r ".followup_backlog_issues[$i].title" review_output.json)
            BODY_FILE=$(mktemp)
            {
              jq -r ".followup_backlog_issues[$i].body" review_output.json
              echo
              echo "_Flagged during review of #${PR_NUMBER}, deliberately not blocking it._"
            } > "$BODY_FILE"
            LABELS=$(jq -r ".followup_backlog_issues[$i].labels | join(\",\")" review_output.json)
            gh issue create -R "$REPO" --title "$TITLE" --body-file "$BODY_FILE" --label "$LABELS" || true
            rm -f "$BODY_FILE"
          done

name: Release on Merge to Main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Serialise release runs per ref to prevent concurrent tag creation and release collisions.
# cancel-in-progress is false so an in-flight release run is never interrupted mid-tag-push.
# GitHub Actions keeps at most one pending run per concurrency group, meaning rapid successive
# merges to main are coalesced into the newest queued run rather than each triggering a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: 'Preflight: release signing secrets present'
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured — refusing to publish a debug-signed release."
            exit 1
          fi
          if [ -z "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "::error::RELEASE_STORE_PASSWORD is not configured — refusing to publish a debug-signed release."
            exit 1
          fi
          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::RELEASE_KEY_ALIAS is not configured — refusing to publish a debug-signed release."
            exit 1
          fi
          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::RELEASE_KEY_PASSWORD is not configured — refusing to publish a debug-signed release."
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Resolve Release Version & Tag
        run: |
          BASE_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="3.0.0"
          fi
          
          # Parse Major.Minor.Patch (X.Y.Z)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR=${MAJOR:-3}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          
          # If tag already exists, increment the PATCH number (3rd digit)
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done
          
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"

      - name: Assert release tag resolved
        run: |
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error::RELEASE_TAG is empty - refusing to publish mis-named artifacts"
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ env.RELEASE_TAG }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

      - name: Decode release keystore
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          if ! DECODE_STDERR=$(echo "$RELEASE_KEYSTORE_BASE64" | base64 -d 2>&1 > "$KEYSTORE_PATH"); then
            echo "::error::Failed to base64-decode RELEASE_KEYSTORE_BASE64 secret: $DECODE_STDERR"
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded release keystore at $KEYSTORE_PATH is missing or empty."
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build distributable APK (release variant)
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Clean up decoded release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      # Package the release variant APK signed with the production release keystore (contrasting with the
      # debug variant signed via the earlier 'Ensure debug keystore' step used during testing).
      - name: Package release-signed APK as release distribution artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/crosstraining-${{ env.RELEASE_TAG }}.apk"

      - name: Verify release signature
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "::error::ANDROID_HOME is unset or $ANDROID_HOME/build-tools directory does not exist."
            exit 1
          fi

          BUILD_TOOLS_DIRS=$(ls -1d "$ANDROID_HOME"/build-tools/* 2>/dev/null || true)
          if [ -z "$BUILD_TOOLS_DIRS" ]; then
            echo "::error::No build-tools versions found under $ANDROID_HOME/build-tools/."
            exit 1
          fi

          APKSIGNER=$(echo "$BUILD_TOOLS_DIRS" | sort -V | tail -n1)/apksigner
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found under $ANDROID_HOME/build-tools/"
            exit 1
          fi

          APK_PATH="dist/crosstraining-${{ env.RELEASE_TAG }}.apk"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -q "CN=Android Debug"; then
            echo "::error::Packaged APK is signed with Android Debug certificate, not a release certificate."
            exit 1
          fi

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.RELEASE_TAG }}" -m "Release ${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CrossTraining ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: dist/crosstraining-${{ env.RELEASE_TAG }}.apk
          body: |
            Official release for **CrossTraining ${{ env.RELEASE_TAG }}**.

            > **Important Note on Upgrades:**
            > This release is signed with our official release keystore. If you currently have an earlier debug-signed build installed, please **uninstall the previous version first** before installing this release to avoid Android signature mismatch errors. Subsequent releases will upgrade in-place seamlessly.

            **Install on your phone:**
            1. Download `crosstraining-${{ env.RELEASE_TAG }}.apk` below.
            2. Open the file on your device.
            3. Allow "Install unknown apps" if prompted, then tap **Install**.


name: Release on Merge to Main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Resolve Release Version & Tag
        run: |
          BASE_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="3.0.0"
          fi
          
          TAG="v$BASE_VERSION"
          
          # Check if tag already exists in remote/local git history
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            PATCH=1
            while git rev-parse "v${BASE_VERSION}.${PATCH}" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            TAG="v${BASE_VERSION}.${PATCH}"
          fi
          
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"

      - name: Build release APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK distribution artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/crosstraining-${{ env.RELEASE_TAG }}.apk"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.RELEASE_TAG }}" -m "Release ${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CrossTraining ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: dist/crosstraining-${{ env.RELEASE_TAG }}.apk
          body: |
            Official release for **CrossTraining ${{ env.RELEASE_TAG }}**.

            **Install on your phone:**
            1. Download `crosstraining-${{ env.RELEASE_TAG }}.apk` below.
            2. Open the file on your device.
            3. Allow "Install unknown apps" if prompted, then tap **Install**.


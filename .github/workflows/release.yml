name: Release on Merge to Main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Serialise release runs per ref to prevent concurrent tag creation and release collisions.
# cancel-in-progress is false so an in-flight release run is never interrupted mid-tag-push.
# GitHub Actions keeps at most one pending run per concurrency group, meaning rapid successive
# merges to main are coalesced into the newest queued run rather than each triggering a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Resolve Release Version & Tag
        run: |
          BASE_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="3.0.0"
          fi
          
          # Parse Major.Minor.Patch (X.Y.Z)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR=${MAJOR:-3}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          
          # If tag already exists, increment the PATCH number (3rd digit)
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done
          
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"

      - name: Assert release tag resolved
        run: |
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error::RELEASE_TAG is empty - refusing to publish mis-named artifacts"
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ env.RELEASE_TAG }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

      # Build the distributable APK. The release build type currently falls back to debug signing
      # via signingConfigs.getByName("debug") in app/build.gradle.kts; switch to assembleRelease
      # once a production release keystore is configured (story #68).
      - name: Build distributable APK (debug variant, debug-signed)
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK distribution artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/crosstraining-${{ env.RELEASE_TAG }}.apk"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.RELEASE_TAG }}" -m "Release ${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CrossTraining ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: dist/crosstraining-${{ env.RELEASE_TAG }}.apk
          body: |
            Official release for **CrossTraining ${{ env.RELEASE_TAG }}**.

            **Install on your phone:**
            1. Download `crosstraining-${{ env.RELEASE_TAG }}.apk` below.
            2. Open the file on your device.
            3. Allow "Install unknown apps" if prompted, then tap **Install**.


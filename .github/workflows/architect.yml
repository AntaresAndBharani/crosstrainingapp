name: Architect

# Headless entry point for the Architect node of the agentic SDLC pipeline.
# Design: ws-setups/graph-engineering/docs/definition-node.md
#
# Batch model (2026-08-23 redesign): Architect only ever operates on
# `type:user-story` issues now — never directly on subtasks. Three label
# conditions:
#   status:ready-for-architect  -> decompose mode: create subtasks if none
#                                  exist yet, or incorporate a PO answer
#                                  into the existing set if they do.
#   status:needs-revision       -> restructure mode: split/merge/create/edit
#                                  subtasks per Three Amigos' batch feedback.
#   status:needs-clarification  -> answer_clarifications mode: resolve
#                                  targeted questions across the batch.
#
# Which subtasks belong to a parent is the real GitHub Sub-issues
# relationship (2026-08-25) — queried directly via `gh api .../sub_issues`
# and linked via the same endpoint's POST right after each `gh issue
# create`. Subtask bodies still carry a "### Parent user story"
# self-reference too (harmless, human-readable), but nothing parses it
# anymore — that was the old mechanism, replaced because GitHub's own
# relationship is authoritative and renders as a real progress checklist
# on the parent, instead of free text a script had to regex out of up to
# 100 issues per lookup.
#
# Security note: issue title/body/comments are untrusted input (this is a
# public repo). Never interpolate them directly into `run:`/`with:` GitHub
# Actions expressions. They're written to files by `gh` (safe) and read by
# Claude via its own file tools, not interpolated into YAML/shell.

on:
  issues:
    types: [labeled]

concurrency:
  group: architect-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write  # claude-code-action@v1 requests a GitHub OIDC token
                   # internally for its own token setup, regardless of the
                   # Anthropic-side auth method — confirmed via a real
                   # failed run (issue #55) without this, not assumed.
                   # Dropped by accident in the 2026-08-23 batch redesign
                   # (2be624e); restored 2026-08-24 after PR #62's review
                   # failure surfaced the same missing permission in
                   # pr-review.yml and prompted an audit of every workflow
                   # using claude-code-action.
#
# Retry-on-overload (2026-08-24): "Run Architect" now attempts up to 3
# times with a 5-minute wait between, same fix applied to pr-review.yml
# after PR #62 hit Anthropic's API returning 529 Overloaded twice in a
# row, ~5 minutes apart — longer than claude-code-action's own internal
# retry (10 attempts, ~3 min total) covers. If all 3 attempts still fail,
# the issue gets a comment explaining why instead of silently stalling.

env:
  OVERLOAD_RETRY_DELAY_SECONDS: 300

jobs:
  architect:
    runs-on: ubuntu-latest
    if: |
      github.event.label.name == 'status:ready-for-architect' ||
      github.event.label.name == 'status:needs-revision' ||
      github.event.label.name == 'status:needs-clarification'
    env:
      GH_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      TRIGGER_LABEL: ${{ github.event.label.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          set -euo pipefail
          IS_STORY=false
          TYPES=$(gh issue view "$ISSUE_NUMBER" -R "$REPO" --json labels -q '[.labels[].name] | join(",")')
          case ",$TYPES," in *,type:user-story,*) IS_STORY=true;; esac

          if [ "$IS_STORY" != "true" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$TRIGGER_LABEL" in
            status:ready-for-architect)  MODE=decompose ;;
            status:needs-revision)       MODE=restructure ;;
            status:needs-clarification)  MODE=answer_clarifications ;;
            *)                           MODE=skip ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Fetch parent + existing subtasks
        if: steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" -R "$REPO" \
            --json number,title,body,labels,comments > issue_context.json

          SUBTASK_NUMS=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/sub_issues" -q '.[].number')
          if [ -z "$SUBTASK_NUMS" ]; then
            echo "[]" > existing_subtasks.json
          else
            echo "$SUBTASK_NUMS" | while read -r N; do
              gh issue view "$N" -R "$REPO" --json number,title,body,labels
            done | jq -s '.' > existing_subtasks.json
          fi

      - name: Select mode-specific prompt
        if: steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          case "${{ steps.mode.outputs.mode }}" in
            decompose)             FILE=architect-decompose.md ;;
            restructure)           FILE=architect-restructure.md ;;
            answer_clarifications) FILE=architect-answer-clarifications.md ;;
          esac
          cp ".github/workflows/prompts/$FILE" architect_task.md

      - name: Run Architect (Claude Opus) — attempt 1
        id: architect_attempt_1
        if: steps.mode.outputs.mode != 'skip'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See prior commits on this file for why both flags are needed:
          # no model specified silently defaults to Sonnet, and
          # claude-code-action's headless mode has no human to approve the
          # Write tool call otherwise.
          claude_args: '--model claude-opus-5 --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'
          prompt: |
            Follow the instructions in the file architect_task.md at the
            repository root exactly. Read issue_context.json and, if
            present and non-empty, existing_subtasks.json before doing
            anything else.

      - name: Wait before retry 2 (Anthropic overload backoff)
        if: steps.mode.outputs.mode != 'skip' && steps.architect_attempt_1.outcome == 'failure'
        run: sleep "$OVERLOAD_RETRY_DELAY_SECONDS"

      - name: Run Architect (Claude Opus) — attempt 2
        id: architect_attempt_2
        if: steps.mode.outputs.mode != 'skip' && steps.architect_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-5 --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'
          prompt: |
            Follow the instructions in the file architect_task.md at the
            repository root exactly. Read issue_context.json and, if
            present and non-empty, existing_subtasks.json before doing
            anything else.

      - name: Wait before retry 3 (Anthropic overload backoff)
        if: >
          steps.mode.outputs.mode != 'skip' &&
          steps.architect_attempt_1.outcome == 'failure' &&
          steps.architect_attempt_2.outcome == 'failure'
        run: sleep "$OVERLOAD_RETRY_DELAY_SECONDS"

      - name: Run Architect (Claude Opus) — attempt 3
        id: architect_attempt_3
        if: >
          steps.mode.outputs.mode != 'skip' &&
          steps.architect_attempt_1.outcome == 'failure' &&
          steps.architect_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-5 --permission-mode dontAsk --allowedTools "Read" "Grep" "Glob" "Write"'
          prompt: |
            Follow the instructions in the file architect_task.md at the
            repository root exactly. Read issue_context.json and, if
            present and non-empty, existing_subtasks.json before doing
            anything else.

      - name: Apply Architect's decision
        if: steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          if [ ! -f architect_output.json ]; then
            gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body "**Architect couldn't complete after 3 attempts (~10 minutes apart):** Anthropic's API returned a server-side overload error each time — not a bug in this pipeline. Check https://status.claude.com; once it clears, either re-label this issue to retrigger, or re-run this workflow manually."
            echo "::error::architect_output.json was not produced after 3 attempts — likely sustained Anthropic API overload, see issue comment."
            exit 1
          fi

          OUTCOME=$(jq -r '.outcome' architect_output.json)

          if [ "$OUTCOME" = "PO_ESCALATION" ]; then
            CONFLICT=$(jq -r '.conflict' architect_output.json)
            gh issue edit "$ISSUE_NUMBER" -R "$REPO" \
              --remove-label "$TRIGGER_LABEL" --add-label "status:needs-po-input"
            {
              echo "**Architect escalation — needs your decision:**"
              echo
              echo "$CONFLICT"
            } | gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body-file -
            exit 0
          fi

          # PROCEED: apply create / update / close.
          render_body() {
            # $1 = jq path into architect_output.json for one subtask object
            jq -r "$1.task_description" architect_output.json > /tmp/body.md
            {
              echo "### Parent user story"
              echo "#${ISSUE_NUMBER}"
              echo
              echo "### Target repository"
              echo "crosstrainingapp"
              echo
              echo "### Task description"
              cat /tmp/body.md
              echo
              echo "### Files / entry points"
              jq -r "$1.entry_points" architect_output.json
              echo
              echo "### Acceptance criteria"
              jq -r "$1.acceptance_criteria[] | \"- [ ] \" + ." architect_output.json
              echo
              echo "### How to verify"
              jq -r "$1.verification" architect_output.json
              echo
              echo "### Size"
              jq -r "$1.size" architect_output.json
              echo
              echo "### Complexity"
              jq -r "$1.complexity" architect_output.json
              echo
              echo "### Blocked by"
              jq -r "$1.blocked_by" architect_output.json
            }
          }

          CREATED=""
          UPDATED=""
          CLOSED=""

          CREATE_COUNT=$(jq '.subtasks.create | length' architect_output.json)
          if [ "$CREATE_COUNT" -gt 0 ]; then
            # Integer database id, NOT the GraphQL node id `gh issue view
            # --json id` returns — the sub_issues endpoint 422s on that.
            # Confirmed live before wiring this in (see PR/commit history).
            PARENT_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" -q .id)
          fi
          for i in $(seq 0 $((CREATE_COUNT - 1))); do
            TITLE=$(jq -r ".subtasks.create[$i].title" architect_output.json)
            BODY_FILE=$(mktemp)
            render_body ".subtasks.create[$i]" > "$BODY_FILE"
            NEW_URL=$(gh issue create -R "$REPO" \
              --title "[Subtask]: $TITLE" \
              --body-file "$BODY_FILE" \
              --label "type:subtask,status:pending-review")
            NEW_NUM=$(basename "$NEW_URL")
            NEW_ID=$(gh api "repos/$REPO/issues/$NEW_NUM" -q .id)
            gh api "repos/$REPO/issues/$ISSUE_NUMBER/sub_issues" -F sub_issue_id="$NEW_ID" > /dev/null
            CREATED="$CREATED #$NEW_NUM"
            rm -f "$BODY_FILE"
          done

          UPDATE_COUNT=$(jq '.subtasks.update | length' architect_output.json)
          for i in $(seq 0 $((UPDATE_COUNT - 1))); do
            SUBTASK_NUM=$(jq -r ".subtasks.update[$i].subtask_number" architect_output.json)
            BODY_FILE=$(mktemp)
            render_body ".subtasks.update[$i]" > "$BODY_FILE"
            gh issue edit "$SUBTASK_NUM" -R "$REPO" --body-file "$BODY_FILE"
            UPDATED="$UPDATED #$SUBTASK_NUM"
            rm -f "$BODY_FILE"
          done

          CLOSE_COUNT=$(jq '.subtasks.close | length' architect_output.json)
          for i in $(seq 0 $((CLOSE_COUNT - 1))); do
            SUBTASK_NUM=$(jq -r ".subtasks.close[$i].subtask_number" architect_output.json)
            REASON=$(jq -r ".subtasks.close[$i].reason" architect_output.json)
            gh issue close "$SUBTASK_NUM" -R "$REPO" --comment "Closed by Architect: $REASON"
            CLOSED="$CLOSED #$SUBTASK_NUM"
          done

          {
            echo "**Architect finished (mode: ${{ steps.mode.outputs.mode }}).**"
            echo
            [ -n "$CREATED" ] && echo "Created:$CREATED"
            [ -n "$UPDATED" ] && echo "Updated:$UPDATED"
            [ -n "$CLOSED" ] && echo "Closed:$CLOSED"
            echo
            echo "Sending the current subtask set to Three Amigos for batch review."
          } | gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body-file -

          # Newly created subtasks start at status:pending-review (informational
          # only, nothing triggers on it) rather than status:review, since
          # review now happens once for the whole batch, triggered by the
          # PARENT'S relabel below — not per-subtask.
          gh issue edit "$ISSUE_NUMBER" -R "$REPO" \
            --remove-label "$TRIGGER_LABEL" --add-label "status:review"

appId: com.fractanomics.crosstraining
---
- launchApp
- tapOn: "Log"
- assertVisible: "Log Session"
- assertVisible: "Select Exercise"
- tapOn: "Select Exercise"
- tapOn: "Back Squat"
- assertVisible: "SET 1"
- tapOn:
    id: "reps_0"

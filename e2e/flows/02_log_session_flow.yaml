appId: com.fractanomics.crosstraining
tags:
  - logging
  - core
---
- launchApp
- extendedWaitUntil:
    visible: "Continue as Guest"
    timeout: 30000
- tapOn: "Continue as Guest"
- tapOn: "Log"
- assertVisible: "Log Session"
- assertVisible: "Select Exercise"
- tapOn: "Select Exercise"
- tapOn: "Back Squat"
- assertVisible: "Add Set"
- tapOn: "reps_0"
- inputText: "5"
- tapOn: "weight_0"
- inputText: "100"
- hideKeyboard
- tapOn: "Add Set"
- assertVisible: "reps_1"
- tapOn: "Save session"
- assertVisible: "Session saved successfully!"
- takeScreenshot: "02_log_session_complete"
